<!DOCTYPE html>
<html lang="es-CO">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/png" href="assets/img/favicon.png">
  <title>Panel de la secretaria — Arte Odontológico</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/landing.css">
  <link rel="stylesheet" href="css/panel.css">
</head>
<body class="pagina-panel">

<a class="saltar-a-contenido" href="#contenido">Saltar al contenido</a>

<header class="encabezado">
  <div class="contenedor encabezado__fila">
    <a href="index.html" class="marca">
      <img class="marca__icono" src="assets/img/logo.png" alt="" width="44" height="44">
      <span>
        <span class="marca__nombre">Arte Odontológico</span>
        <span class="marca__lugar">Odontología estética e integral · Rivera, Huila</span>
      </span>
    </a>
    <div class="encabezado__acciones">
      <span class="encabezado__usuario" data-nombre-usuario></span>
      <button type="button" class="btn btn--secundario" data-cerrar-sesion>Cerrar sesión</button>
    </div>
  </div>
</header>

<div class="contenedor panel-app">
  <!-- Menú de secciones: lateral en escritorio, barra horizontal en celular. -->
  <nav class="panel-nav" aria-label="Secciones del panel">
    <a href="#inicio" data-seccion="inicio">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>
      <span>Inicio</span>
    </a>
    <a href="#agenda" data-seccion="agenda">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4.5" width="18" height="16.5" rx="2"/><path d="M3 9.5h18M8 2.5v4M16 2.5v4"/></svg>
      <span>Agenda</span>
    </a>
    <a href="#disponibilidad" data-seccion="disponibilidad">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
      <span>Disponibilidad</span>
    </a>
    <a href="#mensajes" data-seccion="mensajes">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 11.5a8.4 8.4 0 0 1-12.4 7.4L3 20.5l1.6-5.4A8.4 8.4 0 1 1 21 11.5z"/></svg>
      <span>Mensajes</span>
      <span class="panel-nav__contador" data-contador-mensajes hidden></span>
    </a>
  </nav>

  <main id="contenido" class="panel-contenido" tabindex="-1">
    <!-- El contenido de cada sección lo construye su archivo js/panel-*.js. -->
    <div id="panel-cuerpo"></div>
  </main>
</div>

<!-- ══════════ Diálogo del panel (lo llenan las secciones) ══════════ -->
<div class="modal" id="modal-panel" role="dialog" aria-modal="true" aria-labelledby="titulo-modal-panel" hidden>
  <div class="modal__panel modal__panel--ancho">
    <div class="modal__cabecera">
      <h2 id="titulo-modal-panel" style="font-size:var(--txt-lg)"></h2>
      <button type="button" class="modal__cerrar" data-cerrar aria-label="Cerrar">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <div id="modal-panel-cuerpo"></div>
  </div>
</div>

<script src="js/config.js"></script>
<script src="js/sesion.js"></script>
<script src="js/api.js"></script>
<script src="js/api-demo.js"></script>
<script src="js/modales.js"></script>
<script src="js/comun.js"></script>
<script src="js/panel-comun.js"></script>
<script src="js/panel-agenda.js"></script>
<script src="js/panel-disponibilidad.js"></script>
<script src="js/panel-mensajes.js"></script>
<script src="js/panel-secretaria.js"></script>
</body>
</html>
