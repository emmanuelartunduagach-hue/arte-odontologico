<!DOCTYPE html>
<html lang="es-CO">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/png" href="assets/img/favicon.png">
  <title>Panel de la secretaria — Arte Odontológico</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Antes de los estilos: aplica el modo oscuro sin parpadeo. -->
  <script src="js/tema.js"></script>
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/landing.css">
  <link rel="stylesheet" href="css/panel.css">
</head>
<body class="pagina-panel">

<a class="saltar-a-contenido" href="#contenido">Saltar al contenido</a>

<header class="encabezado">
  <div class="contenedor encabezado__fila">
    <a href="index.html" class="marca">
      <img class="marca__icono" src="assets/img/logo.png" alt="" width="44" height="44">
      <span>
        <span class="marca__nombre">Arte Odontológico</span>
        <span class="marca__lugar">Odontología estética e integral · Rivera, Huila</span>
      </span>
    </a>
    <!-- Menú de la cuenta: cambiar contraseña y cerrar sesión. -->
    <details class="menu-cuenta">
      <summary class="menu-cuenta__boton" aria-label="Menú de la cuenta">
        <span class="menu-cuenta__inicial" data-inicial-usuario aria-hidden="true"></span>
        <span class="menu-cuenta__nombre" data-nombre-usuario></span>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
      </summary>
      <div class="menu-cuenta__lista">
        <button type="button" data-alternar-tema aria-pressed="false">Modo oscuro</button>
        <a href="cambiar-contrasena.html">Cambiar contraseña</a>
        <button type="button" data-cerrar-sesion>Cerrar sesión</button>
      </div>
    </details>
  </div>
</header>

<div class="contenedor panel-app">
  <!-- Menú de secciones: lateral en escritorio, barra horizontal en celular. -->
  <nav class="panel-nav" aria-label="Secciones del panel">
    <a href="#inicio" data-seccion="inicio">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>
      <span>Inicio</span>
    </a>
    <a href="#agenda" data-seccion="agenda">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4.5" width="18" height="16.5" rx="2"/><path d="M3 9.5h18M8 2.5v4M16 2.5v4"/></svg>
      <span>Agenda</span>
    </a>
    <a href="#pacientes" data-seccion="pacientes">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0M16 4.5a3.5 3.5 0 0 1 0 7M18.5 14a6.5 6.5 0 0 1 3 6"/></svg>
      <span>Pacientes</span>
    </a>
    <a href="#disponibilidad" data-seccion="disponibilidad">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
      <span>Horarios</span>
    </a>
    <!-- Solo para el dueño (superadmin): las muestra js/panel-secretaria.js. -->
    <a href="#solicitudes" data-seccion="solicitudes" data-solo-dueno hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 11.5 11 13.5 15.5 9"/><path d="M12 3 4.5 6v5.5c0 4.6 3.2 8.4 7.5 9.5 4.3-1.1 7.5-4.9 7.5-9.5V6z"/></svg>
      <span>Solicitudes</span>
      <span class="panel-nav__contador" data-contador-solicitudes hidden></span>
    </a>
    <a href="#especialistas" data-seccion="especialistas" data-solo-dueno hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7.5 4.5c-1.6 0-2.8 1.3-2.8 3 0 2.4 1 3.6 1.5 6.3.3 1.6.7 3.7 1.7 3.7s1.1-2.3 1.6-3.6c.3-.8.9-1 1.5-1s1.2.2 1.5 1c.5 1.3.6 3.6 1.6 3.6s1.4-2.1 1.7-3.7c.5-2.7 1.5-3.9 1.5-6.3 0-1.7-1.2-3-2.8-3-1.4 0-2 .8-3.5.8s-2.1-.8-3.5-.8Z"/><path d="M17.5 15.5v5M15 18h5"/></svg>
      <span>Especialistas</span>
    </a>
    <a href="#equipo" data-seccion="equipo" data-solo-dueno hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="7.5" r="3.5"/><path d="M5 20.5a7 7 0 0 1 14 0"/><path d="M17.5 3.5 19 5l2.5-2.5"/></svg>
      <span>Equipo</span>
    </a>
  </nav>

  <main id="contenido" class="panel-contenido" tabindex="-1">
    <!-- El contenido de cada sección lo construye su archivo js/panel-*.js. -->
    <div id="panel-cuerpo"></div>
  </main>
</div>

<!-- ══════════ Diálogo del panel (lo llenan las secciones) ══════════ -->
<div class="modal" id="modal-panel" role="dialog" aria-modal="true" aria-labelledby="titulo-modal-panel" hidden>
  <div class="modal__panel modal__panel--ancho">
    <div class="modal__cabecera">
      <h2 id="titulo-modal-panel" style="font-size:var(--txt-lg)"></h2>
      <button type="button" class="modal__cerrar" data-cerrar aria-label="Cerrar">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <div id="modal-panel-cuerpo"></div>
  </div>
</div>

<script src="js/config.js"></script>
<script src="js/sesion.js"></script>
<script src="js/api.js"></script>
<script src="js/api-demo.js"></script>
<script src="js/modales.js"></script>
<script src="js/comun.js"></script>
<script src="js/panel-comun.js"></script>
<script src="js/panel-agenda.js"></script>
<script src="js/panel-pacientes.js"></script>
<script src="js/panel-disponibilidad.js"></script>
<script src="js/panel-mensajes.js"></script>
<script src="js/panel-odontograma.js"></script>
<script src="js/panel-superadmin.js"></script>
<script src="js/panel-secretaria.js"></script>
</body>
</html>
