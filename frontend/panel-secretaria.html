<!DOCTYPE html>
<html lang="es-CO">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/png" href="assets/img/favicon.png">
  <title>Panel de la secretaria — Arte Odontológico</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/landing.css">
  <link rel="stylesheet" href="css/panel.css">
</head>
<body class="pagina-gestion">

<a class="saltar-a-contenido" href="#contenido">Saltar al contenido</a>

<header class="encabezado">
  <div class="contenedor encabezado__fila">
    <a href="index.html" class="marca">
      <img class="marca__icono" src="assets/img/logo.png" alt="" width="44" height="44">
      <span>
        <span class="marca__nombre">Arte Odontológico</span>
        <span class="marca__lugar">Odontología estética e integral · Rivera, Huila</span>
      </span>
    </a>
    <div class="encabezado__acciones">
      <span class="encabezado__usuario" data-nombre-usuario></span>
      <button type="button" class="btn btn--secundario" data-cerrar-sesion>Cerrar sesión</button>
    </div>
  </div>
</header>

<main id="contenido" class="gestion panel">
  <div class="contenedor">
    <nav class="panel__menu" aria-label="Secciones del panel">
      <a href="#inicio" data-seccion="inicio">Inicio</a>
      <a href="#agenda" data-seccion="agenda">Agenda</a>
    </nav>
    <div class="gestion__tarjeta gestion__tarjeta--ancha">
      <!-- El contenido de cada sección lo construye su archivo js/panel-*.js. -->
      <div id="panel-cuerpo"></div>
    </div>
  </div>
</main>

<!-- ══════════ Diálogo del panel (lo llenan las secciones) ══════════ -->
<div class="modal" id="modal-panel" role="dialog" aria-modal="true" aria-labelledby="titulo-modal-panel" hidden>
  <div class="modal__panel modal__panel--ancho">
    <div class="modal__cabecera">
      <h2 id="titulo-modal-panel" style="font-size:var(--txt-lg)"></h2>
      <button type="button" class="modal__cerrar" data-cerrar aria-label="Cerrar">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <div id="modal-panel-cuerpo"></div>
  </div>
</div>

<script src="js/config.js"></script>
<script src="js/sesion.js"></script>
<script src="js/api.js"></script>
<script src="js/api-demo.js"></script>
<script src="js/modales.js"></script>
<script src="js/comun.js"></script>
<script src="js/panel-comun.js"></script>
<script src="js/panel-agenda.js"></script>
<script src="js/panel-secretaria.js"></script>
</body>
</html>
