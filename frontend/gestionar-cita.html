<!DOCTYPE html>
<html lang="es-CO">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/png" href="assets/img/favicon.png">
  <title>Gestionar mi cita — Arte Odontológico</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/landing.css">
</head>
<body class="pagina-gestion">

<a class="saltar-a-contenido" href="#contenido">Saltar al contenido</a>

<header class="encabezado">
  <div class="contenedor encabezado__fila">
    <a href="index.html" class="marca">
      <img class="marca__icono" src="assets/img/logo.png" alt="" width="44" height="44">
      <span>
        <span class="marca__nombre">Arte Odontológico</span>
        <span class="marca__lugar">Odontología estética e integral · Rivera, Huila</span>
      </span>
    </a>
    <div class="encabezado__acciones">
      <a class="btn btn--secundario" href="index.html">Ir al inicio</a>
    </div>
  </div>
</header>

<main id="contenido" class="gestion">
  <div class="contenedor">
    <div class="gestion__tarjeta">
      <!-- El contenido lo construye js/gestionar.js. -->
      <div id="gestion-cuerpo" aria-live="polite"></div>
    </div>
  </div>
</main>

<!-- ══════════ Diálogo: confirmar cancelación (propio, no confirm()) ══════════ -->
<div class="modal" id="modal-cancelar" role="alertdialog" aria-modal="true" aria-labelledby="titulo-cancelar" aria-describedby="texto-cancelar" hidden>
  <div class="modal__panel">
    <div class="modal__cabecera">
      <h2 id="titulo-cancelar" style="font-size:var(--txt-lg)">¿Cancelar tu cita?</h2>
      <button type="button" class="modal__cerrar" data-cerrar aria-label="Cerrar">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <p id="texto-cancelar"></p>
    <p class="alerta" id="error-cancelar" role="alert" hidden></p>
    <div class="acciones">
      <button type="button" class="btn btn--primario" id="confirmar-cancelar">Sí, cancelar la cita</button>
      <button type="button" class="btn btn--secundario" data-cerrar>No, conservarla</button>
    </div>
  </div>
</div>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/api-demo.js"></script>
<script src="js/modales.js"></script>
<script src="js/comun.js"></script>
<script src="js/gestionar.js"></script>
</body>
</html>
