name: Verificación

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Pruebas unitarias
        run: npm test
      - name: Dependencias con vulnerabilidades altas o críticas
        run: npm audit --audit-level=high
      - name: Sintaxis de todo el JavaScript (servidor y cliente)
        working-directory: .
        run: find backend/src frontend/js -name '*.js' -print0 | xargs -0 -n1 node --check
